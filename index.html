      (function() {
        // Safe interceptor to ensure window.fetch is writable and configurable across prototypes
        try {
          var originalFetch = window.fetch;
          var curFetch = originalFetch;
          
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return curFetch; },
              set: function(val) { curFetch = val; },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            try {
              window.fetch = originalFetch;
            } catch (err) {}
          }
        } catch (e) {}

        // Global error & unhandled rejection suppression for third-party extension injection failures
        window.addEventListener('error', function(e) {
          if (e && e.message && (
            e.message.indexOf('fetch') !== -1 ||
            e.message.indexOf('MetaMask') !== -1
          )) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e && e.reason && (e.reason.message || e.reason)) || '';
          if (typeof msg === 'string' && (msg.indexOf('MetaMask') !== -1 || msg.indexOf('fetch') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
